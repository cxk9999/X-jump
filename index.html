<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>X Jump</title>
<style>
  :root {
    --bg: #0f1419;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #1d9bf0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
  }
  .logo {
    font-size: 42px;
    line-height: 1;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 6px 0 22px;
  }
  .status {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .link {
    font-size: 14px;
    color: var(--accent);
    word-break: break-all;
    background: #0d1f2e;
    border: 1px solid #1d3d54;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 20px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tip {
    color: var(--muted);
    font-size: 12px;
    margin-top: 16px;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">🐦</div>
    <h1>X Jump</h1>
    <p class="subtitle">X / Twitter 链接 → Deep Link 跳转</p>
    <p class="status" id="status">正在解析链接…</p>
    <div class="link" id="target">twitter://</div>
    <p class="tip">正在唤醒 X 分身应用…</p>
  </main>

<script>
(function () {
  'use strict';

  var FALLBACK = 'twitter://';

  /* 域名白名单：x.com / twitter.com（忽略 www. / mobile. / m. 前缀） */
  function cleanHost(hostname) {
    return (hostname || '').toLowerCase().replace(/^(www|mobile|m)\./, '');
  }

  function parse(raw) {
    try {
      var u = new URL(raw);
      var host = cleanHost(u.hostname);
      if (host !== 'x.com' && host !== 'twitter.com') return null;
      return u;
    } catch (e) {
      return null;
    }
  }

  /* 非用户主页的保留路径，一律回退到 X 首页 */
  var RESERVED = {
    'home': 1, 'messages': 1, 'explore': 1, 'notifications': 1,
    'search': 1, 'settings': 1, 'compose': 1, 'i': 1, 'intent': 1,
    'intents': 1, 'share': 1, 'bookmarks': 1, 'login': 1, 'signup': 1,
    'tos': 1, 'privacy': 1, 'about': 1, 'jobs': 1, 'help': 1,
    'download': 1, 'account': 1, 'hashtag': 1, 'lists': 1, 'people': 1,
    'trends': 1, 'events': 1
  };

  function resolve(raw) {
    var u = parse(raw);
    if (!u) return FALLBACK;

    var parts = u.pathname.split('/').filter(function (s) { return s.length > 0; });
    if (parts.length === 0) return FALLBACK;

    var first = parts[0].toLowerCase();
    if (RESERVED[first]) return FALLBACK;

    /* 推文：/用户名/status/推文ID */
    if (parts.length >= 3 && parts[1].toLowerCase() === 'status') {
      var id = parts[2];
      if (/^\d+$/.test(id)) return 'twitter://status?id=' + id;
      return FALLBACK;
    }

    /* 用户主页：/用户名 */
    var screenName = parts[0];
    if (/^[A-Za-z0-9_]{1,15}$/.test(screenName)) {
      return 'twitter://user?screen_name=' + screenName;
    }

    return FALLBACK;
  }

  var params = new URLSearchParams(window.location.search);
  var rawUrl = params.get('url') || '';
  var target = resolve(rawUrl);

  var statusEl = document.getElementById('status');
  var targetEl = document.getElementById('target');

  if (!rawUrl) {
    statusEl.textContent = '未提供链接，直接打开 X';
  } else {
    statusEl.textContent = '解析完成，正在跳转…';
  }
  targetEl.textContent = target;

  /* 自动跳转：页面加载时立即执行，避免 Safari 拦截"延迟的、非用户手势"的
     自定义协议跳转；iOS 上会唤起 X 分身应用。 */
  window.location.replace(target);

  /* 兜底：若 1.2s 后页面仍在前台，说明跳转被拦截（此时只能由用户手势触发，
     无按钮可用，提示用户刷新重试） */
  setTimeout(function () {
    if (document.visibilityState === 'visible') {
      statusEl.textContent = '未自动跳转？请刷新本页重试';
    }
  }, 1200);
})();
</script>
</body>
</html>
