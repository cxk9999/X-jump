# X-jump - Loon Remote Rewrite（远程重写订阅）
# 仅劫持「用户主页 / 推文」两类真实链接，接口(i/api/...)与功能页(home/messages/...)一律放行，
# 不影响 X 应用与网页的正常网络。
#
# 使用方法：在 Loon 主配置 [Remote Rewrite] 中添加订阅链接：
#   https://cxk9999.github.io/X-jump/loon_rewrite.conf
# 同时必须在 [MITM] 中启用（否则 HTTPS 链接无法被重写）：
#   hostname = x.com, twitter.com
#
# 若使用过旧版，请先删除旧行再添加本行，并在 Loon 中重新拉取。

# 推文：x.com/用户名/status/推文ID → twitter://status?id=ID（用户名段排除保留路径）
^https?:\/\/x\.com\/(?!(?:i|api|home|messages|explore|notifications|search|settings|compose|intent|intents|share|bookmarks|login|signup|tos|privacy|about|jobs|help|download|account|hashtag|lists|people|trends|events|assets|static|oauth|auth)\b)[A-Za-z0-9_]+\/status\/(\d+) 307 twitter://status?id=$1
^https?:\/\/twitter\.com\/(?!(?:i|api|home|messages|explore|notifications|search|settings|compose|intent|intents|share|bookmarks|login|signup|tos|privacy|about|jobs|help|download|account|hashtag|lists|people|trends|events|assets|static|oauth|auth)\b)[A-Za-z0-9_]+\/status\/(\d+) 307 twitter://status?id=$1
# 用户主页：x.com/用户名 → twitter://user?screen_name=用户名（单段路径，排除保留路径）
^https?:\/\/x\.com\/(?!(?:i|api|home|messages|explore|notifications|search|settings|compose|intent|intents|share|bookmarks|login|signup|tos|privacy|about|jobs|help|download|account|hashtag|lists|people|trends|events|assets|static|oauth|auth)\b)([A-Za-z0-9_]{1,15})\/?(\?.*)?$ 307 twitter://user?screen_name=$1
^https?:\/\/twitter\.com\/(?!(?:i|api|home|messages|explore|notifications|search|settings|compose|intent|intents|share|bookmarks|login|signup|tos|privacy|about|jobs|help|download|account|hashtag|lists|people|trends|events|assets|static|oauth|auth)\b)([A-Za-z0-9_]{1,15})\/?(\?.*)?$ 307 twitter://user?screen_name=$1
